<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Central</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
         <section class="login">

        <h1>Biblioteca Central</h1>

        <form>
            <fieldset>
                <div class="Id">
                    <label for="">Id:</label>
                    <input type="text"  >
                </div>

                <div class="Titulo">
                    <label for="">Título:</label>
                    <input type="text">
                </div>

                 <div class="Nome">
                    <label for="">Nome do Autor:</label>
                    <input type="text">
                </div>

                   <div class="Publicacao">
                    <label for="">Ano de Publicação:</label>
                    <input type="text">
                </div>
            </fieldset>

            <button id="Cadastrar">Cadastrar</button>
        </form>
    </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
